[pytest]
pythonpath = ebiose
testpaths = tests
addopts = -v --tb=short --cov=ebiose --cov-report=html --cov-report=term-missing --cov-fail-under=70
markers =
    integration: integration tests
    unit: unit tests
    slow: slow running tests
    api: API-related tests
    security: security-related tests
    error: error handling tests

[coverage:run]
branch = True
source = ebiose

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod